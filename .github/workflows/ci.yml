name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node for backend
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Build and run backend tests
        working-directory: backend
        run: npm run test

      - name: Setup Node for frontend
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  integration:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and bring up production stack
        run: |
          docker compose -f docker-compose.prod.yml up --build -d

      - name: Wait for services
        run: |
          sleep 5

      - name: Run backend test runner inside api container
        run: |
          docker compose -f docker-compose.prod.yml run --rm api npm run test

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.prod.yml down -v
